[package]
name = "noencodeedit"
version = "1.0.0"
description = "noEncodeEdit — lossless video trimming and audio track editing"
authors = ["vadmonboss"]
license = "GPL-3.0-or-later"
repository = "https://github.com/vadmonboss/noEncodeEdit"
edition = "2021"
rust-version = "1.80"

[lib]
name = "noencodeedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
